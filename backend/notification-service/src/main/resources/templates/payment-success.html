<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Payment Successful</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #4CAF50; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0;">
        <h1 style="margin: 0;">Payment Successful &#10003;</h1>
    </div>
    <div style="border: 1px solid #e0e0e0; padding: 20px; border-radius: 0 0 8px 8px;">
        <p>Dear Customer,</p>
        <p>Your payment has been processed successfully.</p>
        <table style="width: 100%; border-collapse: collapse; margin: 20px 0;">
            <tr>
                <td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>Order ID:</strong></td>
                <td style="padding: 8px; border-bottom: 1px solid #eee;" th:text="${orderId}">ORD-001</td>
            </tr>
            <tr>
                <td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>Amount:</strong></td>
                <td style="padding: 8px; border-bottom: 1px solid #eee;">
                    <span th:text="${currency}">INR</span> <span th:text="${amount}">0.00</span>
                </td>
            </tr>
            <tr>
                <td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>Payment Method:</strong></td>
                <td style="padding: 8px; border-bottom: 1px solid #eee;" th:text="${paymentMethod}">Card</td>
            </tr>
            <tr>
                <td style="padding: 8px;"><strong>Transaction ID:</strong></td>
                <td style="padding: 8px;" th:text="${transactionId}">TXN-001</td>
            </tr>
        </table>
        <p>Thank you for your payment.</p>
        <p style="color: #666; font-size: 12px;">This is an automated notification from PayFlow. Please do not reply to this email.</p>
    </div>
</body>
</html>
