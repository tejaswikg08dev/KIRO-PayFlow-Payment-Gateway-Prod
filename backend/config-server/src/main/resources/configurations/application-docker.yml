# Docker profile — shared overrides for containerized deployment
eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME:payflow}
  data:
    redis:
      host: redis
      port: 6379
  kafka:
    bootstrap-servers: kafka:9092
