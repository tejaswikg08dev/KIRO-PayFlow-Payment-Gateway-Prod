server:
  port: 8080

spring:
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/v1/auth/**
        - id: merchant-service
          uri: lb://merchant-service
          predicates:
            - Path=/v1/merchants/**
        - id: payment-service-orders
          uri: lb://payment-service
          predicates:
            - Path=/v1/orders/**
        - id: payment-service-payments
          uri: lb://payment-service
          predicates:
            - Path=/v1/payments/**
        - id: payment-service-refunds
          uri: lb://payment-service
          predicates:
            - Path=/v1/refunds/**
        - id: settlement-service
          uri: lb://settlement-service
          predicates:
            - Path=/v1/settlements/**
  data:
    redis:
      host: localhost
      port: 6379

rate-limiter:
  requests-per-second: 10
  burst-capacity: 20

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
